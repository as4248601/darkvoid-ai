<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DarkVoid AI</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--c:46,230,255;--ink:#d6f4ff;--dim:#6f9bb5;--err:#ff4d6d;--ok:#34d399;--panel:rgba(6,30,52,.8);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:radial-gradient(ellipse 90% 60% at 50% 38%,#0b4a73 0%,#06263f 40%,#020b16 80%) fixed;color:var(--ink);font-family:'Chakra Petch',system-ui,sans-serif;font-size:15px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 14px 4px}
.title{font-size:12px;letter-spacing:.5em;padding-left:.5em;color:rgb(var(--c));text-shadow:0 0 8px rgba(var(--c),.8)}
.mic{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);justify-self:start}
.dot{width:7px;height:7px;border-radius:50%;background:#52627f;flex:none}
.dot.granted{background:var(--ok)}.dot.denied,.dot.unsupported{background:var(--err)}
.menu{justify-self:end;width:34px;height:34px;border-radius:50%;border:1px solid rgba(var(--c),.35);background:none;color:rgb(var(--c));cursor:pointer;font-size:18px;line-height:1}
.modes{display:flex;justify-content:center;padding:6px 0}
.modes div{display:flex;border:1px solid rgba(var(--c),.35);border-radius:99px;overflow:hidden;background:rgba(2,11,22,.5)}
.modes button{border:0;background:none;color:var(--dim);padding:6px 16px;font:inherit;font-size:13px;cursor:pointer}
.modes button.on{background:rgba(var(--c),.2);color:rgb(var(--c))}
.stage{flex:1;min-height:0;position:relative}
.stage canvas{position:absolute;inset:0;width:100%;height:100%}
.cap{min-height:92px;max-height:30vh;overflow-y:auto;padding:0 20px 10px;text-align:center}
.q{font-size:12px;font-style:italic;color:rgb(var(--c));margin-bottom:6px;overflow-wrap:anywhere}
.a{font-size:16px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.hintTxt{color:var(--dim);font-size:13px;line-height:1.5}
.tag{display:block;margin-top:6px;font-size:11px;color:#fbbf24}
.err{color:var(--err)}
.dock{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid rgba(var(--c),.3)}
.round{width:38px;height:38px;border-radius:50%;flex:none;border:1px solid rgba(var(--c),.6);background:rgba(var(--c),.08);color:rgb(var(--c));display:grid;place-items:center;cursor:pointer}
.round:disabled{opacity:.35}
.dock input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;padding:8px 2px}
.dock input::placeholder{color:var(--dim)}
.dock input:focus{outline:none}
button:focus-visible{outline:2px solid rgb(var(--c));outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(2,10,20,.97);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px 24px;z-index:5}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h2{font-size:15px;font-weight:600;margin:0}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card{border:1px solid rgba(var(--c),.25);background:var(--panel);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:14px;font-weight:600}
.card p{margin:4px 0;color:var(--dim);font-size:13px;line-height:1.5}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid rgba(var(--c),.15);font-size:13px}
.row span:last-child{color:var(--dim);text-align:right}
.btn.on{background:rgba(var(--c),.28);color:rgb(var(--c));border-color:rgb(var(--c))}
  .btn{background:rgba(var(--c),.1);border:1px solid rgba(var(--c),.6);color:rgb(var(--c));border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;margin:4px 6px 0 0}
.item{width:100%;text-align:left;display:block;background:var(--panel);border:1px solid rgba(var(--c),.2);color:var(--ink);border-radius:10px;padding:10px;margin-bottom:6px;font:inherit;cursor:pointer}
.item.on{border-color:rgb(var(--c))}.item small{display:block;color:var(--dim)}
.tr{font-size:13px;line-height:1.45;padding:5px 0;border-top:1px solid rgba(var(--c),.12);white-space:pre-wrap;overflow-wrap:anywhere}
.tr b{color:rgb(var(--c));font-weight:500}
.dot.live{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.cap{min-height:48px}
.vdock{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 16px 16px;border-top:1px solid rgba(var(--c),.25)}
.big{width:68px;height:68px;border-radius:50%;border:1px solid rgb(var(--c));background:rgba(var(--c),.12);color:rgb(var(--c));display:grid;place-items:center;cursor:pointer;box-shadow:0 0 18px rgba(var(--c),.4)}
.big.live{animation:ring 1.3s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 34px rgba(var(--c),.95)}}
.pillbtn{display:flex;align-items:center;gap:7px;border:1px solid rgba(var(--c),.3);border-radius:99px;background:rgba(2,11,22,.5);color:var(--dim);padding:9px 12px;font:inherit;font-size:13px;cursor:pointer}
.pillbtn.on{color:rgb(var(--c));border-color:rgb(var(--c))}
.vdock .round{font:inherit;font-size:13px}
@media (prefers-reduced-motion:reduce){.big.live{animation:none}}
.stage{min-height:110px}
.cap:empty{display:none}
.chat{max-height:34vh;overflow-y:auto;padding:4px 14px;display:flex;flex-direction:column;gap:8px}
.b{max-width:88%;padding:8px 12px;border-radius:14px;line-height:1.45;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.b.user{align-self:flex-end;background:rgba(var(--c),.18);border:1px solid rgba(var(--c),.35);border-bottom-right-radius:4px}
.b.ai{align-self:flex-start;background:var(--panel);border:1px solid rgba(var(--c),.2);border-bottom-left-radius:4px}
.b.errb{align-self:flex-start;border:1px solid var(--err);color:var(--err);background:rgba(255,77,109,.08)}
.tag2{display:block;font-size:10px;letter-spacing:.08em;color:rgb(var(--c));margin-bottom:3px}
.typing{display:flex;gap:5px;padding:12px 14px}
.typing i{width:6px;height:6px;border-radius:50%;background:rgb(var(--c));animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.compose{display:flex;gap:8px;padding:6px 14px}
.compose input{flex:1;min-width:0;background:var(--panel);border:1px solid rgba(var(--c),.3);color:var(--ink);border-radius:12px;padding:10px 12px;font:inherit;font-size:16px}
.compose input:focus{outline:2px solid rgb(var(--c))}
.send{background:rgb(var(--c));color:#04121a;border:0;border-radius:12px;padding:0 16px;font:inherit;font-weight:600;cursor:pointer}
.send:disabled{opacity:.4}
.pillbtn.off{opacity:.55}
@media (prefers-reduced-motion:reduce){.typing i{animation:none;opacity:.7}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script type="text/babel">
const {useState,useRef,useEffect}=React;
const MODES={learn:"Learn",work:"Work",life:"Life"};
const STATES={idle:"Idle",listening:"Listening",thinking:"Thinking",speaking:"Speaking",error:"Error"};

// ---- Orb: canvas, particles + tick ring. States change speed, colour and motion ----

      }

    };
    raf=requestAnimationFrame(draw);
    return()=>{cancelAnimationFrame(raf);ro.disconnect();};
  },[]);

}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const IS_ANDROID=/Android/i.test(navigator.userAgent||"");
const COOLDOWN_MS=700,MAX_LISTEN_MS=20000,START_TIMEOUT_MS=6000;
/* Hands-free wake-word engine contract. The app only calls these members.
   To add a real engine later (on-device engine or native bridge): set available:true and implement
   start({onWake}), stop(), pause(), resume(). onWake must start exactly ONE command session.
   Today it is switched off: continuous Web Speech recognition restarts the mic (and plays Android's
   listening beep) every time the browser ends a session. */
const wakeEngine={
  available:false,
  reason:IS_ANDROID?"Hands-free wake word is turned off on Android Chrome: continuous speech recognition keeps restarting the mic and beeping. Tap the orb to talk.":"Hands-free wake word isn’t enabled in this build. Tap the orb to talk.",
  start(){},stop(){},pause(){},resume(){}
};
const SR_MSG={"no-speech":"I didn’t hear anything. Tap the orb, wait until it listens, then speak.","language-not-supported":"Speech recognition doesn’t support this language here. Try the other language button.",empty:"I didn’t catch that. Tap the orb and try again."};
const LANGS={"en-IN":"EN","hi-IN":"हिं"};
const MIC_LABEL={off:"Mic off",requesting:"Asking permission…",granted:"Mic idle · not listening",denied:"Mic blocked",unsupported:"Voice not supported here"};
const statusOf=(mic,live)=>live==="wake"?"Listening for “Hey DarkVoid”":live==="command"?"Listening to you":MIC_LABEL[mic];

const ERRS={unavailable:"DarkVoid’s AI server is unavailable. Check the deployment and try again.",not_configured:"AI keys are not configured yet. Add the provider keys in Vercel, then retry.",provider_failed:"Neither AI provider could reply. Check your API keys and model access.",claude_failed:"Claude could not reply. Try GPT or Auto mode.",openai_failed:"GPT could not reply. Try Claude or Auto mode.",failed:"Couldn’t get a reply. Tap Retry."};
const EMBEDDED=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
function buildContext(msgs){
  const out=[];
  for(const m of msgs.filter(x=>x.role==="user"||x.role==="ai").slice(-20)){
    const role=m.role==="ai"?"assistant":"user";
    if(out.length&&out[out.length-1].role===role)out[out.length-1].content+="\n"+m.text;
    else out.push({role,content:m.text});
  }
  while(out.length&&out[0].role==="assistant")out.shift();
  return out;
}
function systemPrompt(mode,hi,voice){
  const M={
    learn:"LEARN mode: you are a patient teacher. Explain difficult topics simply and step by step, with an everyday example. If the user seems confused, re-explain in a different, simpler way. After teaching, check understanding with one short question.",
    work:"WORK mode: you are a focused partner for writing, coding, research and productivity. Be practical and structured, and give concrete drafts, code or next actions.",
    life:"LIFE mode: you are a friendly assistant for everyday questions, organising and planning. Give clear, practical help at personal scale."};
  return "You are DarkVoid, a calm, intelligent, concise assistant in the style of JARVIS, running inside a prototype app. Current "+M[mode]+" "+
    (voice?"The user spoke this aloud and your reply will be read aloud: answer in 1 to 4 short plain sentences, with no markdown or lists.":"The user typed this: reply in plain text with no markdown symbols, keep it concise, and use short numbered steps only when steps are requested.")+
    (hi?" The user prefers Hindi or Hinglish: reply in Hinglish written in English letters.":" Reply in the language the user writes in.")+
    " Be honest: say when you do not know something, and do not claim abilities you lack (you cannot set alarms, browse the web, or remember earlier sessions).";
}
async function askAI(mode,hi,voice,ctx,provider){
  try{
    const msgs=buildContext(ctx);
    if(!msgs.length||msgs[msgs.length-1].role!=="user")return{error:"failed"};
    const response=await fetch("/api/chat",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({provider:provider||"auto",system:systemPrompt(mode,hi,voice),messages:msgs})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok)return{error:data.error||"failed",detail:data.message||""};
    const text=(data.text||"").trim();
    return text?{text,provider:data.provider,model:data.model}:{error:"failed"};
  }catch(e){return{error:"unavailable"};}
}

function Sheet({st,close}){
  const {convs,activeId,openConv,newConv,mic,live,setState,setError,msgs,captions,setCaptions,diag,speakTyped,setSpeakTyped,engine,setEngine}=st;

  const mods=["Understanding Engine","Personalization Engine","Teaching Engine","AI Model Orchestrator","Memory Engine","Evaluation Engine","Voice Interaction Engine"];
  return (<div className="sheet"><div className="in">
    <div className="sh"><h2>Menu</h2><button className="btn" onClick={close}>Close</button></div>
    <div className="card"><h3>AI engine</h3><p>Auto tries Claude first, then GPT if Claude is unavailable. You can also choose either engine directly.</p>
      <button className={"btn"+(engine==="auto"?" on":"")} onClick={()=>setEngine("auto")}>Auto</button>
      <button className={"btn"+(engine==="claude"?" on":"")} onClick={()=>setEngine("claude")}>Claude</button>
      <button className={"btn"+(engine==="openai"?" on":"")} onClick={()=>setEngine("openai")}>GPT</button></div>
    <div className="card"><h3>Read replies aloud</h3><p>Questions you speak are always answered aloud. Turn this on to hear replies to typed messages too.</p>
      <button className="btn" onClick={()=>setSpeakTyped(!speakTyped)} aria-pressed={speakTyped}>{speakTyped?"On":"Off"}</button></div>
    
<button className="btn" onClick={()=>{newConv();close();}}>New conversation</button>
    <div className="card" style={{marginTop:10}}><h3>Conversations</h3>
      {convs.map(c=><button key={c.id} className={"item"+(c.id===activeId?" on":"")} onClick={()=>{openConv(c.id);close();}}>
        {c.title||"Empty conversation"}<small>{MODES[c.mode]} mode · {c.msgs.length} messages</small></button>)}
      <p>Only conversation text is kept in this page session. Audio is not recorded or stored by DarkVoid. Text is sent to the selected AI provider through DarkVoid’s secure server endpoint.</p></div>
    <div className="card"><h3>Transcript</h3>
      {msgs.length===0&&<p>Nothing yet.</p>}
      {msgs.map((m,i)=><div className="tr" key={i}><b>{m.role==="user"?"You":m.role==="err"?"Error":"DarkVoid"}</b>{"\n"+m.text}</div>)}</div>
    <div className="card"><h3>Voice and privacy</h3>
      <div className="mic" style={{margin:"4px 0"}}><span className={"dot "+(live!=="off"?"live":mic)}></span>{statusOf(mic,live)}</div>
      <p>Listening uses your browser’s speech service. In Chrome, audio is sent to Google to be turned into text. It works only while this page is open and on screen. When you leave the page, listening stops.</p>
      <p>Tap the orb to talk: one listening session per tap, and tap again to finish early. The hands-free “Hey DarkVoid” wake word is turned off in this build. It needs a dedicated wake-word engine or a native Android app.</p></div>
    <div className="card"><h3>Microphone check</h3>
      <div className="row"><span>Shown inside another page</span><span>{embedded?"Yes":"No"}</span></div>
      <div className="row"><span>Browser mic permission</span><span>{perm}</span></div>
      <div className="row"><span>Last speech error</span><span>{diag||"none"}</span></div>
      <p>If the first line says Yes and the mic still fails, the host page is not passing microphone access to this preview. That is controlled by the host, not by DarkVoid. Use the standalone copy of the file instead.</p></div>
    <div className="card"><h3>Test orb states</h3>
      {Object.keys(STATES).map(k=><button key={k} className="btn" onClick={()=>{setState(k);setError(k==="error"?"Test error: this is a simulated error.":"");close();}}>{STATES[k]}</button>)}</div>
    <div className="card"><h3>Status</h3>
      <div className="row"><span>Text chat with context</span><span>Built · not yet browser-tested</span></div>
      <div className="row"><span>Claude + GPT API routing</span><span>Backend connected · keys required</span></div>
      <div className="row"><span>Learn / Work / Life prompts</span><span>Built · untested</span></div>
      <div className="row"><span>Tap-to-talk voice input</span><span>Rewritten · untested on Android</span></div>
      <div className="row"><span>Hands-free wake word</span><span>Off in this build</span></div>
      <div className="row"><span>Spoken replies</span><span>Built · untested</span></div>
      <div className="row"><span>Background wake word</span><span>Not possible in a browser</span></div>
      <div className="row"><span>Secure server-side API keys</span><span>Vercel environment variables</span></div>
      
{mods.map(m=><div className="row" key={m}><span>{m}</span><span>Not implemented</span></div>)}</div>
  </div></div>);
}

function App(){
  const [mode,setMode]=useState("learn");
  const [engine,setEngine]=useState("auto");
  const [state,setState]=useState("idle");
  const [error,setError]=useState("");
  const [mic,setMic]=useState(SR?"off":"unsupported");
  const [live,setLive]=useState("off");
  const [wakeOn,setWakeOn]=useState(false);
  const [lang,setLang]=useState("en-IN");
  const [captions,setCaptions]=useState(false);
  const [heard,setHeard]=useState("");
  const [cap,setCap]=useState("");
  const [used,setUsed]=useState(false);
  const [diag,setDiag]=useState("");
  const [busy,setBusy]=useState(false),[draft,setDraft]=useState(""),[speakTyped,setSpeakTyped]=useState(false);
  const endRef=useRef(null);
  const [notice,setNotice]=useState("");
  const [open,setOpen]=useState(false);
  const [convs,setConvs]=useState([{id:1,title:"",mode:"learn",msgs:[]}]);
  const [activeId,setActiveId]=useState(1);
  const idc=useRef(1),recRef=useRef(null),phaseRef=useRef("off"),speakingRef=useRef(false),timers=useRef([]),stateRef=useRef("idle"),R=useRef({}),reqRef=useRef(0),cooldownRef=useRef(0),sessTimers=useRef([]),noticeT=useRef(0),speechTok=useRef(0),submitRef=useRef(null);
  R.current={mode,lang,wakeOn,activeId,convs,speakTyped,busy,engine};
  stateRef.current=state;
  const active=convs.find(c=>c.id===activeId),msgs=active.msgs;
  useEffect(()=>{if(endRef.current)endRef.current.scrollIntoView({block:"end"});},[msgs.length,busy]);
  const patch=(id,fn)=>setConvs(cs=>cs.map(c=>c.id===id?fn(c):c));

  const clearSess=()=>{sessTimers.current.forEach(clearTimeout);sessTimers.current=[];};
  const stopRec=()=>{const r=recRef.current;recRef.current=null;phaseRef.current="off";clearSess();
    if(r){r.onend=null;r.onerror=null;r.onresult=null;r.onstart=null;try{r.abort();}catch(e){}}setLive("off");};
  const flash=(msg,ms)=>{setNotice(msg);clearTimeout(noticeT.current);noticeT.current=setTimeout(()=>setNotice(""),ms||6000);};
  const fail=(msg)=>{stopRec();setError(msg);setState("error");
    timers.current.push(setTimeout(()=>{setError("");setState("idle");},7000));};
  // resume() NEVER restarts recognition. It only tells a future wake engine that the turn is over.
  const resume=()=>{if(wakeEngine.available)wakeEngine.resume();};
  const endSpeech=()=>{speakingRef.current=false;cooldownRef.current=Date.now()+COOLDOWN_MS;};
  const say=(text,lng,done)=>{
    setCap(text);
    stopRec();                       // never speak while recognition is open
    const ss=window.speechSynthesis;
    if(!ss){setCaptions(true);setState("idle");done?done():resume();return;}
    const tok=++speechTok.current;   // ignores late events from an older utterance
    try{ss.cancel();}catch(e){}
    speakingRef.current=true;
    if(wakeEngine.available)wakeEngine.pause();
    let finished=false;
    const finish=()=>{if(finished||tok!==speechTok.current)return;finished=true;endSpeech();setState("idle");
      if(done)timers.current.push(setTimeout(done,COOLDOWN_MS));else resume();};
    const parts=text.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
    const v=ss.getVoices();const voice=v.find(x=>x.lang.replace("_","-")===lng)||v.find(x=>x.lang.slice(0,2)===lng.slice(0,2));
    parts.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p);u.lang=lng;if(voice)u.voice=voice;u.rate=.95;u.pitch=.9;
      if(i===0)u.onstart=()=>setState("speaking");
      if(i===parts.length-1)u.onend=u.onerror=finish;
      ss.speak(u);
    });
    // safety net: if the browser never reports the end of speech, stop it and release the lock
    timers.current.push(setTimeout(()=>{if(!finished&&tok===speechTok.current){try{ss.cancel();}catch(e){}finish();}},Math.min(60000,text.length*110+6000)));
  };
  const ack=()=>say(R.current.lang==="hi-IN"?"Ji, boliye.":"Yes?",R.current.lang,()=>listen());
  const handleWake=()=>{if(recRef.current||speakingRef.current||R.current.busy)return;ack();};

  
const ask=(id,m,ctx,voice)=>{
    const hi=R.current.lang==="hi-IN",req=++reqRef.current;
    setBusy(true);setState("thinking");
    askAI(m,hi,voice,ctx,R.current.engine).then(res=>{
      if(req!==reqRef.current)return;
      setBusy(false);
      if(res.text){
        patch(id,c=>({...c,msgs:[...c.msgs,{role:"ai",mode:m,text:res.text,provider:res.provider,model:res.model}]}));
        if(voice||R.current.speakTyped)say(res.text,(hi||/[\u0900-\u097F]/.test(res.text))?"hi-IN":"en-IN");
        else{setState("idle");resume();}
      }else{
        patch(id,c=>({...c,msgs:[...c.msgs,{role:"err",mode:m,text:ERRS[res.error]||ERRS.failed}]}));
        setState("error");timers.current.push(setTimeout(()=>setState("idle"),3000));resume();
      }
    });
  };
  const handle=(text,voice)=>{
    const {mode:m,lang:l,activeId:id}=R.current,hi=l==="hi-IN",t=text.toLowerCase();
    setUsed(true);setHeard(text);setCap("");setError("");
    const mm=t.match(/\b(learn|work|life)\b/);
    if(mm&&t.split(/\s+/).length<=4&&/\bmode\b|मोड/.test(t)){setMode(mm[1]);R.current.mode=mm[1];if(voice)say(MODES[mm[1]]+" mode.","en-IN");return;}
    if(voice&&/^(stop|stop listening|go to sleep|band karo|so ja)\b/.test(t)){setWakeOn(false);R.current.wakeOn=false;
      say(hi?"Theek hai, main sunna band kar raha hoon.":"Okay, I’ll stop listening.",hi?"hi-IN":"en-IN");return;}
    const prior=((R.current.convs.find(c=>c.id===id)||{msgs:[]}).msgs).filter(x=>x.role!=="err");
    patch(id,c=>({...c,title:c.title||text.slice(0,40),mode:m,msgs:[...c.msgs,{role:"user",text}]}));
    ask(id,m,[...prior,{role:"user",text}],voice);
  };
  const sendText=()=>{
    const text=draft.trim();if(!text||busy)return;
    if(text.length>1000){setError("Message is too long. Keep it under 1000 characters.");return;}
    if(phaseRef.current==="command"){stopRec();setState("idle");}
    setDraft("");handle(text,false);
  };
  const retry=()=>{
    if(busy)return;
    const id=R.current.activeId,m=R.current.mode;
    const clean=((R.current.convs.find(c=>c.id===id)||{msgs:[]}).msgs).filter(x=>x.role!=="err");
    if(!clean.length||clean[clean.length-1].role!=="user")return;
    patch(id,c=>({...c,msgs:c.msgs.filter(x=>x.role!=="err")}));
    ask(id,m,clean,false);
  };
  const micNote=mic==="unsupported"?"Voice input isn’t available: this browser has no speech recognition. Typing works.":
    mic==="denied"?(EMBEDDED?"The microphone is blocked here: this page runs inside a preview that doesn’t pass mic access to it. Typing still works. The menu’s Microphone check shows details."
      :"Microphone permission is blocked. Allow it in the site settings (lock icon by the address bar), then reload. Typing still works."):"";

  
// Exactly ONE recognition session per call. Nothing in here restarts itself.
  const listen=()=>{
    if(!SR){setMic("unsupported");return;}
    if(recRef.current||speakingRef.current||R.current.busy)return;       // no overlapping sessions or speech
    if(cooldownRef.current-Date.now()>0){flash("One moment…",1200);return;} // short pause after speech output
    stopRec();phaseRef.current="command";
    const r=new SR();r.lang=R.current.lang;r.continuous=false;r.interimResults=true;r.maxAlternatives=1;
    recRef.current=r;
    let finalText="",lastText="",done=false,started=false,errCode="";
    const submit=()=>{
      if(done)return;done=true;
      const text=(finalText||lastText).trim();       // falls back to the last interim text if no final result arrived
      stopRec();
      if(text){handle(text,true);return;}
      setState("idle");
      if(!errCode)flash(SR_MSG.empty);
    };
    submitRef.current=submit;
    r.onstart=()=>{started=true;setLive("command");setMic("granted");setState("listening");
      sessTimers.current.push(setTimeout(()=>{try{r.stop();}catch(e){}sessTimers.current.push(setTimeout(submit,1500));},MAX_LISTEN_MS));};
    r.onresult=(e)=>{
      let f="",it="";
      for(let i=0;i<e.results.length;i++){const s=e.results[i][0].transcript;if(e.results[i].isFinal)f+=s+" ";else it+=s+" ";}
      finalText=f.trim();lastText=(f+it).trim();setHeard(lastText);
      if(finalText)submit();
    };
    r.onerror=(e)=>{
      const c=e.error;
      if(c==="not-allowed"||c==="service-not-allowed"){done=true;setMic("denied");setDiag(c);fail(window.self!==window.top?"This preview page is not allowed to use the microphone. Open the menu and tap Microphone check.":"Microphone is blocked. Tap the lock icon by the address bar, allow Microphone, then reload.");}
      else if(c==="network"){done=true;fail("Can’t reach the speech service. Check your connection.");}
      else if(c==="audio-capture"){done=true;fail("No microphone was found.");}
      else if(c==="language-not-supported"){done=true;errCode=c;stopRec();setState("idle");flash(SR_MSG[c]);}
      else if(c==="no-speech"){errCode=c;if(!lastText)flash(SR_MSG["no-speech"]);}   // onend follows
    };
    r.onend=()=>{if(recRef.current!==r)return;submit();};
    sessTimers.current.push(setTimeout(()=>{if(!started&&!done){done=true;fail("Couldn’t start the microphone. Tap the orb to try again.");}},START_TIMEOUT_MS));
    try{r.start();}catch(e){done=true;fail("Couldn’t start listening. Tap the orb to try again.");}
  };

  const onMic=()=>{
    if(!SR){fail("Voice input isn’t supported in this browser. Try Chrome on Android.");return;}
    if(speakingRef.current){                    // tap while speaking: only stop the speech
      speechTok.current++;try{window.speechSynthesis.cancel();}catch(e){}endSpeech();setState("idle");return;}
    if(R.current.busy){flash("Still thinking…",1500);return;}
    if(recRef.current){                         // tap while listening: finish and use what was captured
      try{recRef.current.stop();}catch(e){}
      sessTimers.current.push(setTimeout(()=>{if(submitRef.current)submitRef.current();},1500));return;}
    if(mic==="off")setMic("requesting");
    listen();
  };
  const toggleWake=()=>{
    if(!wakeEngine.available){flash(wakeEngine.reason,9000);return;}
    if(wakeOn){wakeEngine.stop();setWakeOn(false);R.current.wakeOn=false;setState("idle");return;}
    setWakeOn(true);R.current.wakeOn=true;wakeEngine.start({onWake:handleWake});
  };
  
const reset=()=>{reqRef.current++;setBusy(false);timers.current.forEach(clearTimeout);timers.current=[];speechTok.current++;if(window.speechSynthesis)speechSynthesis.cancel();speakingRef.current=false;cooldownRef.current=0;stopRec();setState("idle");setError("");setHeard("");setCap("");};
  const newConv=()=>{reset();const id=++idc.current;setConvs(cs=>[{id,title:"",mode,msgs:[]},...cs]);setActiveId(id);resume();};
  const openConv=(id)=>{reset();setActiveId(id);resume();};

  useEffect(()=>{
    const f=()=>{if(document.hidden){stopRec();speechTok.current++;speakingRef.current=false;if(window.speechSynthesis)speechSynthesis.cancel();setState("idle");}};  // leaving the page stops listening; nothing restarts on return
    document.addEventListener("visibilitychange",f);
    return()=>{document.removeEventListener("visibilitychange",f);stopRec();timers.current.forEach(clearTimeout);if(window.speechSynthesis)speechSynthesis.cancel();};
  },[]);

  const st={convs,activeId,openConv,newConv,mic,live,setState,setError,msgs,captions,setCaptions,diag,speakTyped,setSpeakTyped,engine,setEngine};
  return (<div className="app">
    <div className="top">
      <div className="mic" aria-live="polite"><span className={"dot "+(live!=="off"?"live":mic)}></span>{statusOf(mic,live)}</div>
      <div className="title">DARKVOID</div>
      <button className="menu" onClick={()=>setOpen(true)} aria-label="Open menu">⋯</button>
    </div>
    <div className="modes" role="tablist"><div>{Object.keys(MODES).map(k=>
      <button key={k} role="tab" aria-selected={mode===k} className={mode===k?"on":""} onClick={()=>setMode(k)}>{MODES[k]}</button>)}</div></div>
    <div className="stage" onClick={onMic}><Orb stateRef={stateRef}/></div>
    {(msgs.length>0||busy)&&<div className="chat" aria-live="polite">
      {msgs.map((m,i)=>m.role==="user"
        ?<div key={i} className="b user">{m.text}</div>
        :m.role==="err"
        ?<div key={i} className="b errb" role="alert">{m.text}{i===msgs.length-1&&<><br/><button className="btn" onClick={retry}>Retry</button></>}</div>
        :<div key={i} className="b ai"><span className="tag2">DarkVoid · {MODES[m.mode]}{m.provider?" · "+m.provider.toUpperCase():""}</span>{m.text}</div>)}
      {busy&&<div className="b ai typing" aria-label="DarkVoid is typing"><i></i><i></i><i></i></div>}
      <div ref={endRef}></div>
    </div>}
    <div className="cap" aria-live="polite">
      {error?<div className="a err" role="alert">{error}</div>
      :notice?<div className="hintTxt">{notice}</div>
      :micNote?<div className="hintTxt">{micNote}</div>
      :msgs.length===0?<div className="hintTxt">Type below, or tap the orb and speak. Replies use Claude and GPT through DarkVoid’s secure server. API keys must be configured by the project owner.</div>:null}
    </div>
    <div className="compose">
      <input value={draft} onChange={e=>{setDraft(e.target.value);if(error){setError("");if(state==="error")setState("idle");}}}
        onKeyDown={e=>e.key==="Enter"&&sendText()} placeholder={"Message DarkVoid ("+MODES[mode]+")"} enterKeyHint="send" aria-label="Message"/>
      <button className="send" onClick={sendText} disabled={busy||!draft.trim()}>Send</button>
    </div>
    
<div className="vdock">
      <button className={"pillbtn"+(wakeOn?" on":"")+(wakeEngine.available?"":" off")} onClick={toggleWake} aria-pressed={wakeOn} aria-disabled={!wakeEngine.available} title={wakeEngine.available?"":wakeEngine.reason}>
        <span className={"dot"+(wakeOn&&live==="wake"?" live":"")}></span>Hey DarkVoid</button>
      <button className={"big"+(live==="command"?" live":"")} onClick={onMic} aria-label="Speak to DarkVoid">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button className="round" onClick={()=>setLang(l=>l==="en-IN"?"hi-IN":"en-IN")} aria-label="Switch language">{LANGS[lang]}</button>
    </div>
    {open&&<Sheet st={st} close={()=>setOpen(false)}/>}
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
